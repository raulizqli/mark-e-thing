<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prospect Finder — Map Search</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <header class="sidebar-header">
          <h1>Prospect Finder</h1>
          <p>Pick a location on the map and discover local business leads.</p>
        </header>

        <section id="auth-panel" class="auth-panel">
          <h2>Sign in</h2>
          <p class="auth-hint">Use Google or an email magic link to continue.</p>

          <button type="button" id="google-btn" class="btn btn-primary btn-block">
            Continue with Google
          </button>

          <div class="auth-divider"><span>or</span></div>

          <form id="email-auth-form" class="auth-form">
            <label class="field">
              <span>Email</span>
              <input
                id="auth-email"
                type="email"
                placeholder="you@example.com"
                required
              />
            </label>
            <button type="submit" id="magic-link-btn" class="btn btn-secondary btn-block">
              Send magic link
            </button>
          </form>

          <p id="auth-message" class="auth-message hidden"></p>
        </section>

        <section id="session-panel" class="session-panel hidden">
          <div class="session-row">
            <span class="session-email" id="session-email">—</span>
            <button type="button" id="sign-out-btn" class="btn btn-secondary btn-small">
              Sign out
            </button>
          </div>
        </section>

        <form id="search-form" class="search-form hidden">
          <label class="field">
            <span>Business category</span>
            <input
              id="category"
              name="category"
              type="text"
              placeholder="e.g. coffee shop, dentist, gym"
              value="coffee shop"
              required
            />
          </label>

          <label class="field">
            <span>City (optional)</span>
            <input id="city" name="city" type="text" placeholder="Mexico City" />
          </label>

          <label class="field">
            <span>Search radius: <strong id="radius-label">1500</strong> m</span>
            <input
              id="radius"
              name="radiusMeters"
              type="range"
              min="200"
              max="10000"
              step="100"
              value="1500"
            />
          </label>

          <div class="coords">
            <div>
              <span class="coords-label">Latitude</span>
              <code id="lat-display">—</code>
            </div>
            <div>
              <span class="coords-label">Longitude</span>
              <code id="lng-display">—</code>
            </div>
          </div>

          <div class="actions">
            <button type="button" id="locate-btn" class="btn btn-secondary">
              Use my location
            </button>
            <button type="submit" id="search-btn" class="btn btn-primary">
              Start search
            </button>
          </div>
        </form>

        <section id="status-panel" class="status-panel hidden">
          <h2>Search status</h2>
          <div class="status-row">
            <span>Status</span>
            <span id="status-value" class="badge">—</span>
          </div>
          <div class="status-row">
            <span>Businesses found</span>
            <span id="found-value">0</span>
          </div>
          <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <p id="search-id-label" class="search-id"></p>
          <div id="export-actions" class="export-actions hidden">
            <button type="button" id="export-json" class="btn btn-secondary" data-format="json">
              JSON
            </button>
            <button type="button" id="export-csv" class="btn btn-secondary" data-format="csv">
              CSV
            </button>
            <button type="button" id="export-excel" class="btn btn-secondary" data-format="excel">
              Excel
            </button>
          </div>
        </section>

        <section id="analytics-panel" class="analytics-panel hidden">
          <h2>Analytics</h2>
          <div id="analytics-content"></div>
        </section>

        <p id="error-message" class="error-message hidden"></p>
      </aside>

      <main class="map-container">
        <div id="map"></div>
        <div class="map-hint">Click the map or drag the marker to set the search center</div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
